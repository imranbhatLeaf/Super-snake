<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High Score:
                        <span id="high-score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Score:
                        <span id="score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Time
                        <span id="time">0:0:0</span>
                    </h3>
                </div>
            </div>
            <div class="board">
                
            </div>
        </section>
         <div class="modal">
            <div class="start-game">
                <h2>Welcome to Snake Land</h2>
                <button class="start-btn">Start</button>
            </div>
            <div class="gameOver">
                <button class="resetButton">ResetGame</button>
            </div>
        </div>
    </main>
    
  
    

    <script src="script.js"></script>
</body>
</html>
